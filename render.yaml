# Render Blueprint — optional; matches manual Web Service settings.
services:
  - type: web
    name: sports-outdoors
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn -c gunicorn.conf.py wsgi:application
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MAIL_FAIL_OPEN
        value: "false"
      - key: MAIL_TIMEOUT
        value: "8"
      - key: APP_BASE_URL
        value: https://sports-outdoors.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
