# Render Blueprint — optional; matches manual Web Service settings.
services:
  - type: web
    name: sports-outdoors
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn -c gunicorn.conf.py wsgi:application
    # Keeps seller product photos (and other uploads) after git push / redeploy
    disk:
      name: uploads-data
      mountPath: /opt/render/project/src/static/uploads
      sizeGB: 1
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MAIL_FAIL_OPEN
        value: "false"
      - key: MAIL_TIMEOUT
        value: "8"
      - key: APP_BASE_URL
        value: https://sports-outdoors.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_USERNAME
        value: sportsoutdoor25@gmail.com
      - key: RESEND_API_KEY
        value: re_AVJUhuRX_AqEhmyvKoPQEkK4kxebsnpUi
      - key: RESEND_FROM
        value: "Sports & Outdoors <onboarding@resend.dev>"
