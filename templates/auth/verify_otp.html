{% extends "base.html" %}

{% block title %}Verify OTP - Sports and Outdoors Ecommerce System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-success text-white text-center">
                    <h4><i class="fas fa-shield-alt me-2"></i>OTP Verification</h4>
                </div>
                <div class="card-body">
                    {% include 'includes/inline_otp_banner.html' %}
                    <p class="text-muted mb-4">
                        Enter the 6-digit code sent to your email address.
                    </p>

                    <form method="POST">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ prefilled_email }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="otp_code" class="form-label">6-Digit OTP Code</label>
                            <input type="text" class="form-control" id="otp_code" name="otp_code" maxlength="6" pattern="[0-9]{6}" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-check-circle me-2"></i>Verify OTP
                            </button>
                        </div>
                    </form>

                    <hr class="my-4">

                    <div class="d-grid gap-2">
                        <a href="{{ url_for('auth.resend_verification') }}" class="btn btn-outline-success">
                            <i class="fas fa-redo me-2"></i>Resend OTP
                        </a>
                        <a href="{{ url_for('auth.login') }}" class="btn btn-outline-primary">
                            <i class="fas fa-sign-in-alt me-2"></i>Back to Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
