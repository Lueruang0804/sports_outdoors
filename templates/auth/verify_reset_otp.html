{% extends "base.html" %}

{% block title %}Verify Reset OTP - Sports and Outdoors Ecommerce System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow">
                <div class="card-body p-5">
                    {% include 'includes/inline_otp_banner.html' %}
                    <div class="text-center mb-4">
                        <i class="fas fa-shield-alt fa-3x text-warning mb-3"></i>
                        <h2 class="fw-bold">Verify Reset OTP</h2>
                        <p class="text-muted">Enter the 6-digit OTP sent to your email</p>
                    </div>

                    <form method="POST">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" value="{{ prefilled_email }}" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="otp_code" class="form-label">6-Digit OTP</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-key"></i></span>
                                <input type="text" class="form-control" id="otp_code" name="otp_code" maxlength="6" pattern="[0-9]{6}" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-warning w-100 mb-3">Verify OTP</button>

                        <div class="text-center">
                            <a href="{{ url_for('auth.forgot_password') }}" class="text-decoration-none">
                                <i class="fas fa-redo me-1"></i> Request New OTP
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
